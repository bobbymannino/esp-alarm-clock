[package]
name = "esp-alarm-clock"
version = "0.1.0"
edition = "2024"
resolver = "2"

[[bin]]
name = "esp-alarm-clock"
harness = false

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "s"

[dependencies]
log = "0.4"
esp-idf-svc = "0.52"
anyhow = "1"

[build-dependencies]
embuild = "0.33"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
