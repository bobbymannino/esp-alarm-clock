[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
# Only build the zoneinfo the clock needs, the full database is megabytes.
CHRONO_TZ_TIMEZONE_FILTER = "Europe/London"
ESP_IDF_VERSION = "v5.5.4"

[alias]
t = "test -p alarm-core --target aarch64-apple-darwin"
g = "run -p gui --target aarch64-apple-darwin --config unstable.build-std=[]"
